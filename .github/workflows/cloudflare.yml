name: Deploy to Cloudflare

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'wrangler.*'
      - 'migrations/**'
      - 'infra/deployment-check/**'
      - 'infra/cloudflare-bootstrap.json'
      - '.env.example'
      - '.github/scripts/**'
      - '.github/workflows/checks.yml'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Staging runs from develop; production runs from main
        required: true
        type: choice
        options: [staging, production]
        default: staging
      target:
        description: Infrastructure check or the future application
        required: true
        type: choice
        options: [deployment-check, application]
        default: deployment-check

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Read Google configuration and deploy
    needs: checks
    if: >-
      github.ref == 'refs/heads/develop' ||
      (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cloudflare-${{ inputs.environment || 'staging' }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ steps.smoke.outputs.verified_url }}
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'staging' }}
      DEPLOY_TARGET: ${{ inputs.target || 'auto' }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read non-secret Google authentication identifiers
        id: bootstrap
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path('infra/cloudflare-bootstrap.json').read_text())
          environment = config['environments'][os.environ['DEPLOY_ENV']]
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + environment['branch'], 'Wrong deployment branch'
          assert os.environ['GITHUB_REPOSITORY_ID'] == config['repository_id'], 'Wrong repository'
          outputs = {
              'project_id': config['project_id'],
              'provider': config['workload_identity_provider'],
              'service_account': environment['service_account'],
              'secret': environment['secret'],
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, value in outputs.items():
                  output.write(f'{name}={value}\n')
          PY

      - name: Authenticate to Google Cloud without a stored key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.bootstrap.outputs.project_id }}
          workload_identity_provider: ${{ steps.bootstrap.outputs.provider }}
          service_account: ${{ steps.bootstrap.outputs.service_account }}

      - name: Fetch environment values from Google Secret Manager
        id: cloud
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3
        with:
          secrets: |
            environment_json:${{ steps.bootstrap.outputs.project_id }}/${{ steps.bootstrap.outputs.secret }}

      - name: Validate cloud configuration
        id: config
        env:
          CLOUD_ENV_JSON: ${{ steps.cloud.outputs.environment_json }}
        run: python3 .github/scripts/cloudflare_env.py prepare "$DEPLOY_ENV" "$DEPLOY_TARGET"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: '24'

      - name: Install locked dependencies
        if: steps.config.outputs.enabled == 'true'
        env:
          SELECTED_TARGET: ${{ steps.config.outputs.target }}
        run: |
          project=.
          [[ "$SELECTED_TARGET" != deployment-check ]] || project=infra/deployment-check
          npm ci --prefix "$project"

      - name: Build selected target
        if: steps.config.outputs.enabled == 'true'
        env:
          SELECTED_TARGET: ${{ steps.config.outputs.target }}
        run: python3 .github/scripts/cloudflare_env.py build "$DEPLOY_ENV" "$SELECTED_TARGET"

      - name: Deploy using Google-sourced Cloudflare credentials
        if: steps.config.outputs.enabled == 'true'
        env:
          SELECTED_TARGET: ${{ steps.config.outputs.target }}
        run: python3 .github/scripts/cloudflare_env.py deploy "$DEPLOY_ENV" "$SELECTED_TARGET"

      - name: Smoke-test deployed release
        id: smoke
        if: steps.config.outputs.enabled == 'true'
        env:
          SELECTED_TARGET: ${{ steps.config.outputs.target }}
        run: python3 .github/scripts/cloudflare_env.py smoke "$DEPLOY_ENV" "$SELECTED_TARGET"

      - name: Summarize delivery state
        if: always()
        env:
          DEPLOY_ENABLED: ${{ steps.config.outputs.enabled }}
          SELECTED_TARGET: ${{ steps.config.outputs.target }}
          TARGET_URL: ${{ steps.config.outputs.target_url }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: python3 .github/scripts/cloudflare_env.py summary "$DEPLOY_ENV" "$SELECTED_TARGET" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary secret material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/iskra-environment.json" "$RUNNER_TEMP/iskra-worker-secrets.json" "$RUNNER_TEMP/iskra-wrangler.json"
