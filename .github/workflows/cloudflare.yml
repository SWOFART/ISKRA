name: Deploy to Cloudflare

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'wrangler.*'
      - 'migrations/**'
      - 'infra/deployment-check/**'
      - '.github/workflows/checks.yml'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Staging runs from develop; production runs from main
        required: true
        type: choice
        options: [staging, production]
        default: staging
      target:
        description: Infrastructure check or the future application
        required: true
        type: choice
        options: [deployment-check, application]
        default: deployment-check

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Deploy and smoke-test
    needs: checks
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      (github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cloudflare-${{ inputs.environment || 'staging' }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'staging' }}
      CLOUDFLARE_ENV: ${{ inputs.environment || 'staging' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      APP_URL: ${{ vars.APP_URL }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_MAPTILER_KEY: ${{ vars.VITE_MAPTILER_KEY }}
      VITE_MAP_STYLE_URL: ${{ vars.VITE_MAP_STYLE_URL }}
      VITE_API_BASE: /api

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require deployment prerequisites
        id: project
        env:
          DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          [[ "$DEPLOY_ENABLED" == true ]] || { echo '::error::Enable deployment only after completing infra/runbook.md.'; exit 1; }
          expected_branch=refs/heads/develop
          [[ "$DEPLOY_ENV" != production ]] || expected_branch=refs/heads/main
          [[ "$GITHUB_REF" == "$expected_branch" ]] || { echo "::error::$DEPLOY_ENV must deploy from $expected_branch."; exit 1; }
          target="$REQUESTED_TARGET"
          if [[ -z "$target" ]]; then
            target=deployment-check
            [[ ! -f package.json ]] || target=application
          fi
          project=.
          [[ "$target" != deployment-check ]] || project=infra/deployment-check
          [[ "$DEPLOY_ENV" != production || "$target" == application ]] || { echo '::error::The infrastructure test Worker must never be deployed as production.'; exit 1; }
          [[ -f "$project/package.json" && -f "$project/package-lock.json" ]] || { echo '::error::The selected deployment target and its lockfile must exist.'; exit 1; }
          [[ -f "$project/wrangler.jsonc" || -f "$project/wrangler.json" || -f "$project/wrangler.toml" ]] || { echo '::error::Missing Wrangler project configuration.'; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo '::error::Set the environment secret CLOUDFLARE_API_TOKEN.'; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo '::error::Set the environment variable CLOUDFLARE_ACCOUNT_ID.'; exit 1; }
          [[ "$APP_URL" == https://* && "$APP_URL" != *'?'* && "$APP_URL" != *'#'* ]] || { echo '::error::Set APP_URL to the deployed HTTPS origin without query or fragment.'; exit 1; }
          echo "directory=$project" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ steps.project.outputs.directory }}/package-lock.json

      - name: Install locked dependencies
        working-directory: ${{ steps.project.outputs.directory }}
        run: npm ci

      - name: Build for selected environment
        working-directory: ${{ steps.project.outputs.directory }}
        run: npm run build

      - name: Deploy Worker and static assets
        working-directory: ${{ steps.project.outputs.directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm exec --no -- wrangler deploy --env "$DEPLOY_ENV" --var "RELEASE_SHA:$GITHUB_SHA"

      - name: Smoke-test deployed release
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 \
            "${APP_URL%/}/api/health?release=$GITHUB_SHA" \
            | python3 -c 'import json, os, sys; data=json.load(sys.stdin); assert data.get("ok") is True, "Health check failed"; assert data.get("release") == os.environ["GITHUB_SHA"], "The expected release is not serving traffic"'

      - name: Summarize deployment
        env:
          DEPLOY_TARGET: ${{ steps.project.outputs.target }}
        run: |
          {
            echo "Environment: $DEPLOY_ENV"
            echo "Target: $DEPLOY_TARGET"
            echo "Release: $GITHUB_SHA"
            echo "Application: $APP_URL"
            echo 'Deployment and release health check passed. Full Green-flow acceptance remains a separate milestone.'
          } >> "$GITHUB_STEP_SUMMARY"
